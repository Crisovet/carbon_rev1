 const mk=(n,up,dn,out)=>{const xs=[60,140];let b=xs.map(x=>T(x,50,'C',1)).join('');
  (n==1?[0]:n==2?[-4,4]:[-7,0,7]).forEach(o=>b+=`<line x1="74" y1="${50+o}" x2="126" y2="${50+o}"/>`);
  up.forEach((v,i)=>{if(v)b+=part(xs[i],38,xs[i],28,xs[i],17,v)});
  dn.forEach((v,i)=>{if(v)b+=part(xs[i],62,xs[i],72,xs[i],83,v)});
  out.forEach((v,i)=>{if(v)b+=i?part(152,50,166,50,178,50,v):part(48,50,34,50,22,50,v)});
  return b};

const app=document.getElementById("app"),$=id=>document.getElementById(id);
let U=null,P={k:{},sent:0,t:0},lt=Date.now(),sending=0,G;
try{U=JSON.parse(localStorage.getItem('sci10-u'))}catch(e){}
try{const s=JSON.parse(localStorage.getItem('sci10-carbon-p2'));if(s)P=Object.assign(P,s)}catch(e){}
const save=()=>{try{localStorage.setItem('sci10-carbon-p2',JSON.stringify(P))}catch(e){}};
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const cntDone=()=>K.filter((_,i)=>P.k[i]!=null).length;
const complete=()=>cntDone()==K.length;
const addTime=()=>{P.t=(P.t||0)+Math.min(Math.round((Date.now()-lt)/1000),600);lt=Date.now()};

/* ---------- Details form ---------- */
function ask(){$('ov').hidden=false;$('fe').textContent='';if(U){$('fn').value=U.n;$('fc').value=U.c;$('fp').value=U.p}$('fn').focus()}
$('fc').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'');$('fp').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'');
$('f').onsubmit=e=>{e.preventDefault();const n=$('fn').value.trim(),c=$('fc').value.trim(),p=$('fp').value.trim(),m=$('fe');
 if(!n){m.textContent='Please enter your name.';return}if(!/^\d{1,2}$/.test(c)){m.textContent='Please enter your class as a number, for example 10.';return}if(!/^\d{10}$/.test(p)){m.textContent='Please enter a 10-digit phone number.';return}
 U={n,c,p};try{localStorage.setItem('sci10-u',JSON.stringify(U))}catch(x){}$('ov').hidden=true;home()};

/* ---------- Sending: ONLY when the whole chapter is complete ---------- */
function tally(){let s=0,t=0,good=[],rev=[];
 K.forEach((d,i)=>{const v=P.k[i]||0,n=d.steps.length;s+=v;t+=n;(v==n?good:rev).push(d.id+" "+d.root)});
 return{s,t,good,rev}}
function push(){
 sending=1;const r=tally(),sec=P.t||0;
 const p={name:U.n,class:U.c,Class:U.c,className:U.c,studentClass:U.c,phone:U.p,Phone:U.p,quiz:"Science X – "+TITLE+" (Keyword Chain)",score:String(r.s),total:String(r.t),percentage:(r.s/r.t*100).toFixed(1),timeTaken:String(sec),timeFormatted:Math.floor(sec/60)+"m "+sec%60+"s",topicsCorrect:r.good.join(", "),topicsRevise:r.rev.join(", "),photoAttached:"No",photoCount:"0"};
 let fr=$('subFrame');if(!fr){fr=document.createElement('iframe');fr.name=fr.id='subFrame';fr.style.display='none';fr.setAttribute('aria-hidden','true');document.body.appendChild(fr)}
 let fin=0,tm;const ok=()=>{if(fin)return;fin=1;clearTimeout(tm);fr.onload=null;P.sent=1;save();sending=0;const e=$('st');if(e)e.textContent=`Chapter score ${r.s} / ${r.t} sent to your teacher ✓`};
 tm=setTimeout(ok,60000);const t0=Date.now();fr.onload=()=>setTimeout(ok,Math.max(0,600-(Date.now()-t0)));
 const f=document.createElement('form');f.method='POST';f.action=URL_;f.target='subFrame';f.style.display='none';
 Object.keys(p).forEach(n=>{const i=document.createElement('input');i.type='hidden';i.name=n;i.value=p[n];f.appendChild(i)});
 document.body.appendChild(f);f.submit();f.remove()}
function checkChapter(){
 if(!complete())return `<p class="st">${cntDone()} of ${K.length} topics done — finish all to send your score.</p>`;
 if(P.sent)return `<p class="st" id="st">Chapter complete ✓ Score already sent.</p>`;
 if(!sending)push();
 return `<p class="st" id="st"><b>Chapter complete! 🎉</b> Sending chapter score…</p>`}
function resend(){push();home()}

/* ---------- Chapter page ---------- */
function home(){if(!U){ask();return}
 let h=`<h1>${TITLE}</h1><p class="sub">Keyword Chain · Science Class X</p><p class="who">${esc(U.n)} · Class ${esc(U.c)} <button class="link" onclick="ask()">Change</button></p><div class="prog"><i style="width:${cntDone()/K.length*100}%"></i></div>`;
 if(complete())h+=P.sent?`<div class="banner">🎉 Chapter complete · score sent ✓</div>`:`<div class="banner wait">🎉 Chapter complete! ${sending?'Sending score…':'Score not confirmed yet.'} <button class="link" onclick="resend()">Send again</button></div>`;
 h+=`<p class="sub" style="margin:8px 0 0">Finish a topic to unlock the next one. Your score is sent once, when every topic is complete.</p>`;
 let last="";
 K.forEach((d,i)=>{
  if(d.part!=last){last=d.part;const L=K.filter(x=>x.part==d.part);h+=`<div class="sec">${PN[d.part]} <small>${L.filter(x=>P.k[K.indexOf(x)]!=null).length}/${L.length}</small></div>`}
  const ok=P.k[i]!=null,open=true;/* TEMP: all unlocked. Restore: open=ok||i==0||P.k[i-1]!=null */
  h+=`<button class="row${ok?' ok':''}" ${open?`onclick="kplay(${i})"`:'disabled'}><span>${ok?'✓':open?'▶':'🔒'}</span>${d.id} · ${esc(d.title)}${ok?`<b>${P.k[i]}/${d.steps.length}</b>`:''}</button>`});
 app.innerHTML=h;window.scrollTo(0,0)}

/* ================= KEYWORD CHAIN ================= */
const fmt=s=>s.replace(/([A-Za-z)])(\d+)/g,"$1<sub>$2</sub>");
const eqb=d=>{let n=0;
 const bl=()=>{const k=n++;return k<G.s?`<span class="node">${fmt(esc(d.steps[k].a))}</span>`:`<span class="bx${k==G.s?' cur':''}">?</span>`};
 const part=x=>{x=x.trim();return x=="{}"?bl():x?`<span class="ct">${fmt(esc(x))}</span>`:''};
 return d.eq.split("$").map(t=>`<div class="eqln">`+t.split(/(@\([^)]*\)|\{\})/).map(x=>{
  if(x=="{}")return bl();
  if(x.slice(0,2)=="@("){const p=x.slice(2,-1).split("||");const top=part(p[0]||""),bot=part(p[1]||"");return `<span class="arrw"><span class="at">${top}</span><span class="al"></span><span class="ab">${bot}</span></span>`}
  x=x.trim();return x?`<span class="op">${fmt(esc(x))}</span>`:''}).join("")+`</div>`).join("")};
const eqt=d=>{let n=0;const f=()=>fmt(esc(d.steps[n++].a));
 return d.eq.split("$").map(t=>t.split(/(@\([^)]*\)|\{\})/).map(x=>{
  if(x=="{}")return f();
  if(x.slice(0,2)=="@(")return "—("+x.slice(2,-1).split("||").map(y=>y.trim()=="{}"?f():fmt(esc(y.trim()))).filter(Boolean).join(" / ")+")→";
  return fmt(esc(x))}).join("")).join(". ")};
function kplay(i){lt=Date.now();G={i,s:0,m:0,first:0,got:[],lock:0};kdraw()}
function kdraw(){G.lock=0;
 const d=K[G.i],st=d.steps[G.s];
 const br=f=>`<span class="br"></span><span class="node from">${esc(f)}</span>`;
 let b=`<span class="node root">${esc(d.root)}</span>`;
 G.got.forEach((g,k)=>{const s=d.steps[k];if(s.f)b+=br(s.f);b+=`<span class="arr"><b>${esc(s.s)}</b><span class="ln"></span><i class="en">${esc(s.e)}</i></span><span class="node">${rich(g)}</span>`});
 const fin=G.s>=d.steps.length;
 if(!fin){if(st.f)b+=br(st.f);b+=`<span class="arr q"><b>${esc(st.s)}</b><span class="ln"></span><i class="en">${esc(st.e)}</i></span>`}
 if(d.eq)b=eqb(d);
 let h=`<div><div class="top"><button class="back" onclick="home()">‹ Topics</button><span class="hud">Step ${Math.min(G.s+1,d.steps.length)} of ${d.steps.length}</span></div>
 <div class="tt">${d.id} · ${esc(d.title)}</div><div class="prog"><i style="width:${G.s/d.steps.length*100}%"></i></div><div class="kboard">${b}</div>`;
 if(!fin){const subj=st.f||(G.got.length?G.got[G.got.length-1]:d.root);
  h+=(d.eq?`<div class="ask"><span>Highlighted box mein kya aayega?</span> What goes in the highlighted box?</div>`:`<div class="ask"><span>${esc(plain(subj))}</span> ${esc(st.l)}</div>`)+`${st.dq?`<div class="qd">${rich(st.dq)}</div>`:''}<div class="opts">`;
  sh(st.o).forEach(o=>h+=`<button class="opt${dgo(o)?' dgopt':''}" data-a="${o===st.a?1:0}" onclick="kpick(this)">${d.eq?fmt(rich(o)):rich(o)}</button>`);h+='</div>'}
 else{const n=d.steps.length,sent=d.eq?eqt(d):esc(d.root)+d.steps.map(s=>(s.f?". "+esc(s.f)+" ":" ")+esc(s.s)+" "+esc(plain(s.a))).join("")+(d.tail?" "+esc(d.tail):"")+".",nx=G.i+1<K.length?G.i+1:null;
  P.k[G.i]=Math.max(P.k[G.i]||0,G.first);addTime();save();
  const status=checkChapter();
  h+=`<div class="end"><h3>${G.first==n?'Perfect chain! ⭐':'Chain complete! 👏'}</h3><p><b>${G.first}</b> of ${n} keywords right on the first try.</p><p>${sent}</p>${d.mn?`<p class="mn">Mnemonic: ${esc(d.mn)}</p>`:''}${status}
  <button class="go" onclick="kplay(${G.i})">Play again</button><button class="go" onclick="${nx!=null?`kplay(${nx})`:`home()`}">${nx!=null?'Next topic':'Back to chapter'}</button></div>`}
 app.innerHTML=h+'</div>';window.scrollTo(0,0)}
function kpick(el){if(G.lock)return;
 if(el.dataset.a=="1"){G.lock=1;const st=K[G.i].steps[G.s];if(!G.m)G.first++;G.m=0;G.got.push(st.a);G.s++;el.classList.add("good");setTimeout(kdraw,450)}
 else{G.m++;el.classList.add("bad")}}

home();
</script></body></html>
